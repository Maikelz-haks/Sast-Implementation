name: "DevSecOps - SAST Implementation"

on:
  push:
    branches:
      - prod
      - dev
  pull_request:
    branches:
      - prod
      - dev

jobs:
  # Layer 1 - Secrets Leak Detection 
  secrets-leak-detection:
      runs-on: ubuntu-latest

      # Least privilege - Zero Trust
      permissions:
        contents: read
        pull-requests: write

      # Steps
      steps:

        # Clone repository
        - uses: actions/checkout@v4
          with:
            fetch-depth: 0
        
        # Gitleaks Scan
        - name: Gitleaks Scan
          uses: gitleaks/gitleaks-action@v2
          env:
            GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
            GITLEAKS_ENABLE_COMMENTS: true

        # Upload GitHub Storage Artifact
        - name: Upload Gitleaks Report
          uses: actions/upload-artifact@v4
          with:
            name: gitleaks-report
            path: results.sarif

        # Upload to SIEM OPTION
        #- name: Upload to SIEM
          #if: failure()
          #run: |
            #curl -X POST https://example.com/api/upload \
              #-H "Authorization: Bearer ${{ secrets.SIEM_TOKEN }}" \
              #-F "file=@results.sarif"



  # Layer 2 - SAST (Static Application Security Testing)
  sast-code-analysis:
      runs-on: ubuntu-latest
      needs: secrets-leak-detection

     # Least privilege - Zero Trust
      permissions:
        contents: read
        actions: read
        security-events: write
        statuses: write
        
      # Steps
      steps:
        - name: Checkout
          uses: actions/checkout@v4

        - name: Setup Node
          uses: actions/setup-node@v4
          with:
            node-version: "20"
            cache: "npm"

        - name: Install deps
          run: npm ci

        - name: Install Semgrep
          run: python -m pip install --upgrade pip semgrep

        - name: Run Semgrep and generate SARIF
          run: |
            semgrep scan \
              --config p/react \
              --config p/javascript \
              --config p/owasp-top-ten \
              --sarif --output semgrep.sarif \
              --exclude node_modules \
              --exclude build \
              --exclude dist

        - name: Upload Semgrep SARIF Report
          uses: github/codeql-action/upload-sarif@v4
          with:
            sarif_file: semgrep.sarif
            category: semgrep

        - name: Upload Semgrep Report
          uses: actions/upload-artifact@v4
          with:
            name: semgrep-report
            path: semgrep.sarif

  # Layer 3 - Dependency Scanning (SCA - Software Composition Analysis)
  dependency-scanning:
      runs-on: ubuntu-latest
      needs: sast-code-analysis

      # Least privilege - Zero Trust
      permissions:
        contents: read
        security-events: write  
        pull-requests: write
      

      # Steps
      steps:
        # Clone repository
        - uses: actions/checkout@v4

        # Setup Node.js with version
        - name: Setup Node.js
          uses: actions/setup-node@v4
          with:
            node-version: '20'
            cache: 'npm'

        # Snyk Security Scan
        - name: Snyk Security Scan
          uses: snyk/actions/node@master
          continue-on-error: true  
          env:
            SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }} # requires account in snyk.io
          with:
            args: --severity-threshold=high --sarif-file-output=snyk.sarif

        # Upload Snyk SARIF to GitHub Security
        - name: Upload Snyk SARIF to GitHub Security
          if: always()
          uses: github/codeql-action/upload-sarif@v4
          with:
            sarif_file: snyk.sarif
            category: snyk-dependencies

        # Upload GitHub Storage Artifact
        - name: Upload Snyk Report
          if: always()
          uses: actions/upload-artifact@v4
          with:
            name: snyk-report
            path: snyk.sarif

        # Double check: npm audit (manual check)
        - name: npm audit (fallback)
          if: always()
          run: |
            echo "Running npm audit as fallback..."
            npm audit --audit-level=high
          continue-on-error: true

  # Layer 4 - Infrastructure as Code (IaC) Scanning
  iac-scanning:
      runs-on: ubuntu-latest
      needs: dependency-scanning
      # Least privilege - Zero Trust
      permissions:
        contents: read 
        security-events: write # 
        actions: read
      
      # steps
      steps:
        # Checks-out your repository under $GITHUB_WORKSPACE, so follow-up steps can access it
        - uses: actions/checkout@v3

        - name: Checkov GitHub Action
          uses: bridgecrewio/checkov-action@v12
          with:
            # This will add both a CLI output to the console and create a results.sarif file
            directory: k8s/
            framework: all
            output_format: cli,sarif
            output_file_path: console,results.sarif
            continue-on-error: true
          
        - name: Upload SARIF file
          uses: github/codeql-action/upload-sarif@v2
          
          # Results are generated only on a success or failure
          # this is required since GitHub by default won't run the next step
          # when the previous one has failed. Security checks that do not pass will 'fail'.
          # An alternative is to add `continue-on-error: true` to the previous step
          # Or 'soft_fail: true' to checkov.
          if: success() || failure()
          with:
            sarif_file: results.sarif


