title = "Gitleaks configuration"

[extend]
useDefault = true

[[rules]]
id = "generic-api-key"
description = "Generic API Key"
regex = '''(?i)(api[_-]?key|apikey|secret[_-]?key|access[_-]?key|auth[_-]?token|password)\s*[:=]\s*['"]?[a-zA-Z0-9_\-]{16,}['"]?'''

[[rules]]
id = "env-variable-secret"
description = "Environment variable with secret"
regex = '''(?i)^[A-Z_]+\s*=\s*['"]?.{10,}['"]?$'''
path = '''\.(env|envDocker)$'''