apiVersion: apps/v1
kind: Deployment
metadata:
  name: vulnerable-app
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vulnerable-app
  template:
    metadata:
      labels:
        app: vulnerable-app
    spec:
      containers:
      - name: vulnerable-container
        image: nginx:latest
        securityContext:
          privileged: true # Vulnerability: Running as privileged
          runAsUser: 0     # Vulnerability: Running as root
        ports:
        - containerPort: 80
